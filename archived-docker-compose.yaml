services:
  web:
    build:
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    image: ${GO_IMAGE_NAME}
  db:
    build:
      dockerfile: postgres.Dockerfile
    ports:
      - "5432:5432"
    args:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PWD=${DB_PWD}
      - DB_NAME=${DB_NAME}
      - GCS_BUCKET=${GCS_BUCKET}
      - JWT_KEY=${JWT_KEY}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PWD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    image: ${DB_IMAGE_NAME}